{% extends "base.html" %}
{% block title %}US Army Drone Team – Skynet{% endblock %}
{% block content %}
<style>
  .container{width:92%;max-width:900px;margin:2rem auto}
  .stack{display:grid;gap:1rem}
  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
  .alerts{max-width:900px;margin:.5rem auto 1rem}
  .alert{padding:10px 14px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:8px;text-align:center}
  .alert-success{background:#f0fff0;border-color:#b2e6b2}
  .alert-error{background:#fff0f0;border-color:#e6b2b2}
  form.app-form{display:grid;gap:12px}
  .row{display:grid;gap:10px}
  .row.cols-2{grid-template-columns:1fr 1fr}
  .field label{font-size:.9rem;display:block;margin-bottom:4px}
  .field input,.field textarea, .field select{width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
  .field textarea{min-height:120px;resize:vertical}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{padding:10px 14px;border:1px solid var(--border-strong);background:var(--muted);border-radius:var(--radius);cursor:pointer;text-decoration:none;color:inherit}
  .btn:hover{filter:brightness(.97)}
  .meta{color:var(--text-muted);font-size:.9rem}
</style>

<div class="container stack">
  <h1>US Army Drone Team Application</h1>

  <div class="card">
    <form class="app-form" method="post" action="{{ url_for('team.apply') }}" enctype="multipart/form-data">
      <div class="row cols-2">
        <div class="field">
          <label for="name">Full name *</label>
          <input id="name" name="name" required>
        </div>
        <div class="field">
          <label for="grade">Soldier's Grade *</label>
          <select id="grade" name="grade" required>
            <option value="" disabled selected>Select your grade</option>
            <option value="E-1">E-1</option>
            <option value="E-2">E-2</option>
            <option value="E-3">E-3</option>
            <option value="E-4">E-4</option>
            <option value="E-5">E-5</option>
            <option value="E-6">E-6</option>
            <option value="E-7">E-7</option>
            <option value="E-8">E-8</option>
            <option value="E-9">E-9</option>
            <option value="WO1">WO1</option>
            <option value="CW2">CW2</option>
            <option value="CW3">CW3</option>
            <option value="CW4">CW4</option>
            <option value="CW5">CW5</option>
            <option value="O-1">O-1</option>
            <option value="O-2">O-2</option>
            <option value="O-3">O-3</option>
            <option value="O-4">O-4</option>
            <option value="O-5">O-5</option>
          </select>
        </div>
      </div>

      <div class="row cols-2">
        <div class="field">
          <label for="unit">Unit *</label>
          <input id="unit" name="unit" required placeholder="e.g., 1-101 AVN (ARB)">
        </div>
      </div>

      <div class="row cols-2">
        <div class="field">
          <label for="email">Email *</label>
          <input id="email" name="email" type="email" required>
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" placeholder="optional">
        </div>
      </div>

      <div class="row cols-2">
        <div class="field">
          <label for="years_experience">Years of experience</label>
          <input id="years_experience" name="years_experience" type="number" min="0" step="1" placeholder="e.g., 4">
        </div>
        <div class="field">
          <label for="primary_platforms">Primary platforms</label>
          <input id="primary_platforms" name="primary_platforms" placeholder="e.g., RQ-7B, MQ-1C, Raven">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="skills">Key skills</label>
          <input id="skills" name="skills" placeholder="e.g., ISR, EW, swarm tactics">
        </div>
      </div>

      <!-- Availability Questions -->
      <div class="row">
        <div class="field">
          <label>Will you be deploying within the next 12 months?</label>
          <div>
            <label><input type="radio" name="deploying_12mo" value="Yes" required> Yes</label>
            <label><input type="radio" name="deploying_12mo" value="No"> No</label>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Will you be on paternity/maternity leave within the next 12 months?</label>
          <div>
            <label><input type="radio" name="parental_leave_12mo" value="Yes" required> Yes</label>
            <label><input type="radio" name="parental_leave_12mo" value="No"> No</label>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="tdy_restrictions">Will you be available for TDY or have any restrictions to availability the team should be aware about?</label>
          <textarea id="tdy_restrictions" name="tdy_restrictions" placeholder="Explain any restrictions or notes on TDY availability."></textarea>
        </div>
      </div>


      <div class="row">
        <div class="field">
          <label for="statement">Motivation / Statement</label>
          <textarea id="statement" name="statement" placeholder="Brief statement on why you want to join the team."></textarea>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="video">Intro video — mp4/mov/avi/mkv</label>
          <input id="video" name="video" type="file" accept=".mp4,.mov,.avi,.mkv">
        </div>
      </div>
      
      <!-- Submit Application -->
      <div class="actions">
        <button class="btn" type="submit">Submit Application</button>
        <a class="btn" href="{{ url_for('team.apply') }}">Reset</a>
      </div>

      <p class="meta">Max size is limited by server config (MAX_CONTENT_LENGTH). If your upload fails, try compressing the video.</p>
    </form>
  </div>
</div>
{% endblock %}
