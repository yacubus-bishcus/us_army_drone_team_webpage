<!-- drone_team/templates/base.html -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>{% block title %}drone_team{% endblock %}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body{% block body_attrs %}{% endblock %}>
  {% include "partials/nav.html" %}
  <div class="site-banner" role="status" aria-live="polite">
    <span class="site-banner__text">Track is now Open. Be sure to Access the USADT Recruitment Competition V2 Track. The old recruitment track will not be considered.</span>
  </div>
  <main class="site-main" {% block main_attrs %}{% endblock %}>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">
      <a href="{{ url_for('core.license_page') }}">License</a>
      <span aria-hidden="true">&bull;</span>
      <a href="{{ url_for('core.disclaimer_page') }}">Disclaimer</a>
    </div>
  </footer>
  </body>

</html>
