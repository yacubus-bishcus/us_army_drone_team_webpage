{% include "partials/flashes.html" %}

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Request Access — drone_team</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#fafafa; color:#222; }
    .wrap { width:min(520px,92%); margin:3rem auto; background:#fff; border:1px solid #bbb; border-radius:10px; padding:1rem; }
    h1 { margin-top:0; text-align:center; }
    .alert { padding:10px; border-radius:8px; margin-bottom:10px; text-align:center; }
    .alert--error { border:1px solid #e6b2b2; background:#fff0f0; }
    .alert--info { border:1px solid #b7d1f0; background:#f0f6ff; }
    form { display:grid; gap:10px; }
    label { font-size:.9rem; }
    input, textarea { padding:10px; border:1px solid #bbb; border-radius:8px; }
    button, a.btn { padding:10px 14px; border:1px solid #999; background:#eee; border-radius:8px; cursor:pointer; text-decoration:none; color:inherit; text-align:center; }
    .row { display:flex; gap:10px; justify-content:space-between; align-items:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Request Access</h1>
    {% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}
    <p class="alert alert--info">
      A temporary password will be issued within 24 hours. Please check your email, including your SPAM folder, for instructions.
    </p>
    <form method="POST" action="{{ url_for('auth.register_page') }}">
      <div>
        <label for="username">Desired Username</label>
        <input id="username" name="username" type="text" required />
      </div>
      <div>
        <label for="email">Your Email</label>
        <input type="email" name="email"
               title="Use your @army.mil email address or sponsor required.">
      </div>
      <div>
        <label for="sponsor_email">Sponsor Email (Optional)</label>
        <input type="email" name="sponsor_email"
               title="Must be an Army.mil email.">
      </div>
      <div class="row">
        <button type="submit">Submit Request</button>
        <a class="btn" href="{{ url_for('core.home') }}">Back</a>
      </div>
    </form>
  </div>
</body>
</html>
