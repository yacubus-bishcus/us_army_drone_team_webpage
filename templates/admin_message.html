<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>{{ title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#fafafa; color:#222; }
    .wrap { width:min(560px,92%); margin:3rem auto; background:#fff; border:1px solid #bbb; border-radius:10px; padding:1rem; text-align:center; }
    h1 { margin-top:0; }
    .ok  { color:#146c2e; }
    .bad { color:#8a1f1f; }
    a.btn { display:inline-block; margin-top:1rem; padding:10px 14px; border:1px solid #999; background:#eee; border-radius:8px; text-decoration:none; color:inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>{{ title }}</h1>
    <p class="{{ 'ok' if ok else 'bad' }}">{{ message }}</p>
    <a class="btn" href="{{ url_for('core.home') }}">Back to Home</a>
  </div>
</body>
</html>
